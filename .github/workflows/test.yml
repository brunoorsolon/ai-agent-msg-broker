name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Verify pinned built-in SQLite runtime
        run: node --input-type=module -e "import {DatabaseSync} from 'node:sqlite'; const d=new DatabaseSync(':memory:'); if(d.prepare('SELECT sqlite_version() AS v').get().v!=='3.53.3')process.exit(1); d.close()"
      - run: npm run check
      - name: Check local-lab shell syntax
        run: bash -n scripts/start-local-claude-lab.sh scripts/copy-image-node.sh scripts/start-local-broker.sh scripts/start-lan-broker.sh scripts/docker-publish-smoke.sh
      - run: npm test
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and test image (no registry push)
        run: docker build --target test -f Containerfile -t broker-test:ci .
      - name: Run HTTP integration as nonroot without external networking
        run: docker run --rm --network none --user node broker-test:ci node --test test/http.test.mjs
      - name: Build nonroot runtime image
        run: docker build --target runtime -f Containerfile -t broker-runtime:ci .
      - name: Verify runtime identity and SQLite availability
        run: docker run --rm --network none broker-runtime:ci node --input-type=module -e "import {DatabaseSync} from 'node:sqlite'; if(process.getuid()===0)process.exit(1); const d=new DatabaseSync(':memory:'); d.close()"
      - name: Smoke actual broker entrypoint as nonroot with disposable fixtures
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m broker-runtime:ci node scripts/container-smoke.mjs
      - name: Verify shipped no-credential connectivity bootstrap
        run: docker run --rm --network none --read-only --tmpfs /data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700 broker-runtime:ci node scripts/container-empty-smoke.mjs
      - name: Verify ordinary Docker published port and persistent volume
        run: bash scripts/docker-publish-smoke.sh broker-runtime:ci
      - name: Validate Compose packaging without starting another service
        run: docker compose -f compose.yaml config --quiet
      - name: Install pinned browser QA tools in an isolated CI virtualenv
        run: |
          python3 -m venv "$RUNNER_TEMP/approval-browser"
          "$RUNNER_TEMP/approval-browser/bin/pip" install playwright==1.62.0
          "$RUNNER_TEMP/approval-browser/bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libnss3-tools
          echo "$RUNNER_TEMP/approval-browser/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/approval-browser/bin/python" scripts/approval-browser-retry-test.py
      - name: Check out immutable pre-approval broker for real schema3 migration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: bd2dd445de4bf3105f20caafb471f280bf981b63
          path: .legacy-broker-source
          persist-credentials: false
      - name: Build prior runtime locally without registry publication
        run: docker build --target runtime -f .legacy-broker-source/Containerfile -t broker-legacy:ci .legacy-broker-source
      - name: Test ordinary Compose admin UI and persistent approval bootstrap
        run: bash scripts/approval-compose-smoke.sh broker-runtime:ci
        env:
          APPROVAL_TEST_LEGACY_IMAGE: broker-legacy:ci
          APPROVAL_TEST_ARTIFACTS: ${{ runner.temp }}/approval-ui-compose
      - name: Keep sanitized actual-browser UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approval-ui-compose
          path: ${{ runner.temp }}/approval-ui-compose/*.png
          if-no-files-found: warn
          retention-days: 7
  rootless-podman:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify preinstalled unprivileged rootless Podman
        run: |
          test "$(id -u)" -ne 0
          command -v podman
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - name: Build digest-pinned runtime with rootless Podman
        run: podman build --target runtime -f Containerfile -t localhost/broker-podman:ci .
      - name: Smoke private bind mounts and restart under keep-id without network
        run: node scripts/podman-smoke.mjs localhost/broker-podman:ci
      - name: Verify isolated host runtime copied from the same local image
        run: |
          umask 077
          lab=$(mktemp -d "$RUNNER_TEMP/broker-node-copy.XXXXXXXX")
          trap 'rm -r -- "$lab"' EXIT
          bash scripts/copy-image-node.sh localhost/broker-podman:ci "$lab/node"
          "$lab/node" --test test/local-claude-lab.test.mjs
      - name: Run exact broker-only bootstrap without native clients or connector clone
        run: node scripts/local-broker-bootstrap-smoke.mjs localhost/broker-podman:ci
      - name: Verify host HTTPS from a separate rootless container without host-loopback exception
        run: node scripts/lan-broker-bootstrap-smoke.mjs localhost/broker-podman:ci
      - name: Install pinned browser QA tools in an isolated CI virtualenv
        run: |
          python3 -m venv "$RUNNER_TEMP/approval-browser"
          "$RUNNER_TEMP/approval-browser/bin/pip" install playwright==1.62.0
          "$RUNNER_TEMP/approval-browser/bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libnss3-tools
          echo "$RUNNER_TEMP/approval-browser/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/approval-browser/bin/python" scripts/approval-browser-retry-test.py
      - name: Check out immutable pre-approval broker for real schema3 migration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: bd2dd445de4bf3105f20caafb471f280bf981b63
          path: .legacy-broker-source
          persist-credentials: false
      - name: Build prior runtime locally without registry publication
        run: podman build --target runtime -f .legacy-broker-source/Containerfile -t localhost/broker-legacy:ci .legacy-broker-source
      - name: Test rootless product admin UI and recreated data-volume approval
        run: node scripts/approval-container-smoke.mjs podman localhost/broker-podman:ci
        env:
          APPROVAL_TEST_LEGACY_IMAGE: localhost/broker-legacy:ci
          APPROVAL_TEST_ARTIFACTS: ${{ runner.temp }}/approval-ui-podman
      - name: Keep sanitized rootless actual-browser UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approval-ui-podman
          path: ${{ runner.temp }}/approval-ui-podman/*.png
          if-no-files-found: warn
          retention-days: 7
