name: Packaged connector transport matrix
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: connector-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cooperative-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/pi-broker-connector
          ref: f3d3bfc5cd17c10697d52e892f88c06a22ee2b16
          path: .matrix/pi
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/claude-code-broker-connector
          ref: e04de626a0d01dc6345eb750364e719dd59cc319
          path: .matrix/claude
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/antigravity-broker-connector
          ref: f3e0da54134bc03bd81f3c06c5ccc385d484b95e
          path: .matrix/antigravity
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: matuto-ai/opencode-broker-connector
          ref: 55b297525e6f931ab5c6ac377d1d8ccab8155bfb
          path: .matrix/opencode
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install immutable OpenCode host tool schema dependency
        working-directory: .matrix/opencode
        run: npm ci --ignore-scripts
      - name: Verify matrix syntax
        run: node --check integration/connector-driver.mjs && node --check integration/connector-matrix.test.mjs
      - name: Pack all four connectors and test 16 routes twice with real TLS/admin approval
        env:
          PSST_MATRIX_SOURCES: '{"pi":".matrix/pi","claude-code":".matrix/claude","antigravity-cli":".matrix/antigravity","opencode":".matrix/opencode"}'
        run: node --test integration/connector-matrix.test.mjs
      # Synthetic host events + cooperative receive/ack are not authenticated model
      # acceptance. Official host/Compose/Podman gates remain in each repository;
      # OpenCode automatic admission and Antigravity sign-in remain separate gates.
